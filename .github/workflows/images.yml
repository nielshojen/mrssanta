# Builds every container and pushes it to GitHub Container Registry when a
# pull request is merged into main (or anything else is pushed there).
#
# Images: ghcr.io/<owner>/mrssanta/<container>, tagged latest and with the
# commit SHA. Point Terraform's image_registry at ghcr.io/<owner>/mrssanta.

name: Container images

on:
  push:
    branches: [main]
    paths:
      - "containers/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.container }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container:
          - admin
          - api
          - eventupload
          - metrics
          - postflight
          - preflight
          - ruledownload
          - web
          - worker
          - xsrf

    steps:
      - uses: actions/checkout@v5

      # GHCR image names must be lower case.
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mrssanta/${{ matrix.container }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: containers/${{ matrix.container }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.container }}
          cache-to: type=gha,mode=max,scope=${{ matrix.container }}
